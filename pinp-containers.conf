# Defaults for nested containers created via Jenkins Docker Plugin

[containers]

# Resolve host.containers.internal in nested containers to the outer host instead of pinp
host_containers_internal_ip = "169.254.1.2"

# Reap orphaned processes in nested containers
init=true

# Use pasta networking for nested containers
# Overrides insecure default defined in /etc/containers/containers.conf
netns = "pasta"

# Use local timezone in nested containers
tz="local"

# Exclude pinp from nested container namespaces while retaining a consistent mapping for shared volumes
userns = "nomap"

# Isolate nested container IPC namespaces
# Overrides insecure default defined in /etc/containers/containers.conf
ipcns = "private"

[network]

# Route host.containers.internal in nested containers to the outer host instead of pinp
pasta_options = ["--map-guest-addr", "none"]
